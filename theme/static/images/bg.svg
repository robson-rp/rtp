<svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
        <filter id="noise" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
        <radialGradient id="planetGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:currentColor;stop-opacity:0" />
        </radialGradient>
    </defs>
    
    <!-- Texture Noise -->
    <rect width="100%" height="100%" filter="url(#noise)" opacity="0.03"/>
    
    <!-- Planets (Abstract Circles) -->
    <g fill="currentColor" opacity="0.05">
        <circle cx="85%" cy="15%" r="30" />
        <circle cx="15%" cy="90%" r="40" />
        <circle cx="50%" cy="50%" r="2" opacity="0.5" /> <!-- Star -->
        <circle cx="20%" cy="40%" r="1" opacity="0.5" /> <!-- Star -->
        <circle cx="70%" cy="30%" r="1.5" opacity="0.5" /> <!-- Star -->
        <circle cx="80%" cy="60%" r="1" opacity="0.5" /> <!-- Star -->
    </g>

    <!-- Monk Silhouette (Abstract/Minimalist) -->
    <!-- Sitting figure in bottom right corner -->
    <g transform="translate(700, 500) scale(0.5)" fill="currentColor" opacity="0.08">
        <!-- Head -->
        <circle cx="50" cy="30" r="15" />
        <!-- Body (Robes) -->
        <path d="M20,100 Q20,50 50,50 Q80,50 80,100 Z" />
        <!-- Shoulders/Arms hint -->
        <path d="M15,100 C10,80 30,60 50,60 C70,60 90,80 85,100" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
</svg>